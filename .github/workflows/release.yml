name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. v1.0.0)"
        required: true
        default: "v0.0.0-test"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV
          } else {
            echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_ENV
          }

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          New-Item -ItemType Directory -Force -Path dist
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\EnViDict.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "EnViDict ${{ env.VERSION }}"
          body: |
            ## EnViDict ${{ env.VERSION }}

            ### Installation
            1. Download `EnViDict-${{ env.VERSION }}-Setup.exe`
            2. Run it — the app installs automatically
            3. Launch from the Start Menu or Desktop shortcut

            ### What's included
            - EnViDict.exe — the main application
            - dictionary.db — English→Vietnamese dictionary (271,584 entries)
            - Start Menu & Desktop shortcuts
            - Uninstaller (via Add/Remove Programs)
          files: dist/EnViDict-${{ env.VERSION }}-Setup.exe
          draft: false
          prerelease: false
